services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: dieta_facil
      POSTGRES_USER: dieta_facil
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dieta_facil -d dieta_facil']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
