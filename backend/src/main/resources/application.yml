spring:
  application:
    name: dieta-facil
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dieta_facil}
    username: ${DB_USER:dieta_facil}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
server:
  address: 127.0.0.1
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
management:
  endpoints:
    web:
      exposure:
        include: health
app:
  public-base-url: ${PUBLIC_BASE_URL:http://127.0.0.1:5173}
  mail:
    mode: ${MAIL_MODE:file}
    encryption-key: ${MAIL_ENCRYPTION_KEY:}
    from: ${MAIL_FROM:}
    api-key: ${BREVO_API_KEY:}
    directory: ${MAIL_DIRECTORY:../.local/mail}
